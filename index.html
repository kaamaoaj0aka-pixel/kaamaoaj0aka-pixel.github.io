<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>抖音解析</title>
<style>
:root{--bg:#0b0b0f;--card:rgba(28,28,34,.72);--line:rgba(255,255,255,.09);--txt:#f2f2f5;--dim:#9a9aa5;--pink:#fe2c55;--blue:#4ea1ff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--txt);font:16px/1.5 -apple-system,"PingFang SC","Helvetica Neue",sans-serif;padding:calc(12px + env(safe-area-inset-top)) 14px calc(20px + env(safe-area-inset-bottom));max-width:680px;margin-left:auto;margin-right:auto}
h1{font-size:22px;margin:6px 2px 12px;display:flex;align-items:center;gap:8px}
h1 .dot{width:10px;height:10px;border-radius:50%;background:var(--pink);box-shadow:0 0 12px var(--pink)}
.warn{margin:10px 2px 0;padding:12px;border:2px solid #ff3b30;border-radius:14px;background:rgba(255,59,48,.12);color:#ff6b62;font-weight:800;font-size:17px;text-align:center;letter-spacing:1px}
.card{background:var(--card);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:12px}
textarea,input{width:100%;background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:12px;color:var(--txt);font-size:16px;padding:12px;margin:6px 0;outline:none}
textarea:focus,input:focus{border-color:var(--pink)}
textarea{resize:vertical;min-height:74px}
button.go{width:100%;margin-top:8px;padding:14px;border:0;border-radius:14px;background:linear-gradient(135deg,#fe2c55,#ff6b4a);color:#fff;font-size:17px;font-weight:700;cursor:pointer}
button.go:disabled{opacity:.55}
.row{display:flex;gap:8px;align-items:center}
.row input{flex:1}
.chip{font-size:12px;color:var(--dim);border:1px solid var(--line);border-radius:20px;padding:4px 10px;background:transparent;cursor:pointer;white-space:nowrap}
.meta{display:flex;gap:10px;align-items:center}
.av{width:46px;height:46px;border-radius:50%;object-fit:cover;background:#222}
.tt{font-weight:700;font-size:16px;margin:8px 0 4px;word-break:break-all}
.stats{display:flex;flex-wrap:wrap;gap:6px 14px;color:var(--dim);font-size:13px;margin:8px 0}
.stats b{color:var(--txt);font-weight:600}
.cover{width:100%;border-radius:12px;margin-top:8px;display:block}
.q{display:flex;align-items:center;gap:8px;padding:10px 0;border-top:1px solid var(--line)}
.q:first-of-type{border-top:0}
.q .lv{flex:1;font-weight:600}
.q .sz{color:var(--dim);font-size:13px}
.btn{border:1px solid var(--line);background:rgba(255,255,255,.07);color:var(--txt);border-radius:10px;padding:8px 12px;font-size:14px;cursor:pointer;text-decoration:none;display:inline-block}
.btn:active{transform:scale(.96)}
.btn.pri{background:var(--pink);border:0;font-weight:700}
.imgs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.imgs img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:10px}
.err{color:#ff7a90}
.ok{color:#7ddf9a;font-size:13px}
.spin{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:s 0.8s linear infinite;vertical-align:-3px;margin-right:6px}
@keyframes s{to{transform:rotate(360deg)}}
.foot{color:var(--dim);font-size:12px;text-align:center;margin-top:16px}
details{margin-top:8px}
details summary{color:var(--dim);font-size:14px;cursor:pointer}
</style>
</head>
<body>
<h1><span class="dot"></span>抖音解析</h1>
<div class="warn">⚠️ 李杰制作 · 禁止散播泛滥 · 否则死妈</div>

<div class="card">
  <textarea id="u" placeholder="粘贴抖音分享链接，或整段分享口令文本"></textarea>
  <div class="row">
    <input id="t" type="password" placeholder="访问密码（首次使用需填写）">
    <button class="chip" id="saveT" type="button">记住</button>
  </div>
  <div class="row" style="margin-top:2px">
    <button class="chip" id="apiChip" type="button">线路：阿里云 ⇄</button>
    <span style="font-size:12px;color:var(--dim)" id="apiHint">解析失败会自动换线路重试</span>
  </div>
  <details>
    <summary>高级选项</summary>
    <input id="m" placeholder="合集 ID / 合集链接（可选，用于取精确播放量）">
  </details>
  <button class="go" id="goBtn" onclick="go()">解析</button>
  <div id="out"></div>
</div>
<div class="foot">无水印直链约 1 小时内有效 · 解析走你的私人接口</div>

<script>
const APIS = [
  {name:'阿里云', url:'https://dy-web-xraeercqms.cn-hangzhou.fcapp.run'},
  {name:'Vercel',  url:'https://dyserver-wine.vercel.app'},
];
let apiIdx = parseInt(localStorage.dy_api || '0', 10) || 0;
const $ = id => document.getElementById(id);
t.value = localStorage.dy_token || '';
function apiName(){ return APIS[apiIdx].name; }
function renderApiChip(){ $('apiChip').textContent = '线路：'+apiName()+' ⇄'; }

$('saveT').onclick = () => { localStorage.dy_token = t.value.trim(); toast('已记住密码'); };
$('apiChip').onclick = () => { apiIdx = (apiIdx+1)%APIS.length; localStorage.dy_api = String(apiIdx); renderApiChip(); toast('已切换到'+apiName()+'线路'); };
renderApiChip();
function toast(s){ const d=document.createElement('div'); d.className='card ok'; d.textContent=s; $('out').prepend(d); setTimeout(()=>d.remove(),1800); }
function esc(s){ return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function fmtMB(b){ return (b/1048576).toFixed(1)+'MB'; }
function copyTxt(txt, btn){
  navigator.clipboard.writeText(txt).then(()=>{ const o=btn.textContent; btn.textContent='已复制'; setTimeout(()=>btn.textContent=o,1200); });
}

async function fetchParse(q){
  // 主线路失败（网络不通）时自动切备用线路重试一次
  const order=[apiIdx, ...APIS.map((_,i)=>i).filter(i=>i!==apiIdx)];
  let lastErr=null;
  for(const i of order){
    try{
      const r=await fetch(APIS[i].url+'/parse?'+q.toString());
      const j=await r.json();
      if(i!==apiIdx){ apiIdx=i; localStorage.dy_api=String(i); renderApiChip(); }
      j._via=APIS[i].name; return j;
    }catch(e){ lastErr=e; }
  }
  throw lastErr;
}

async function go(){
  const btn=$('goBtn'); btn.disabled=true;
  $('out').innerHTML='<div class="card"><span class="spin"></span>解析中…（'+esc(apiName())+'线路）</div>';
  try{
    const q=new URLSearchParams({u:$('u').value.trim(), token:t.value.trim()});
    if($('m').value.trim()) q.set('mix_id',$('m').value.trim());
    const r=await fetchParse(q);
    if(r.code!==200){ $('out').innerHTML=`<div class="card err">❌ ${esc(r.msg||('请求失败 '+r.code))}</div>`; return; }
    render(r.data, r.cached, r._via);
  }catch(e){ $('out').innerHTML=`<div class="card err">❌ 请求失败：${esc(e.message||e)}<br><span style="font-size:13px">两条线路都不通，换个网络（Wi-Fi/流量）再试</span></div>`; }
  finally{ btn.disabled=false; }
}

function render(d, cached, via){
  const st=[['❤️ 点赞',d.digg_count],['💬 评论',d.comment_count],['⭐ 收藏',d.collect_count],['↗️ 分享',d.share_count],['▶️ 播放',d.play_count_text||'—']]
    .map(([k,v])=>`<span>${k} <b>${esc(v)}</b></span>`).join('');
  let h=`<div class="card">
    <div class="meta">${d.author_avatar?`<img class="av" src="${esc(d.author_avatar)}">`:''}
      <div><div style="font-weight:700">${esc(d.author||'')}</div>
      <div style="color:var(--dim);font-size:13px">@${esc(d.author_id||'')} · ${esc(d.create_time||'')}</div></div></div>
    <div class="tt">${esc(d.title)}</div>
    <div class="stats">${st}</div>
    <div style="color:var(--dim);font-size:13px">${esc(d.work_type||'')}${d.duration_s?` · ${d.duration_s}秒`:''}${d.music?` · 🎵 ${esc(d.music)}`:''}${d.mix_episode?` · 合集第${d.mix_episode}集`:''}${cached?' · <span class="ok">缓存</span>':''}${via?` · 经${esc(via)}线路`:''}</div>
    ${d.cover_url?`<img class="cover" src="${esc(d.cover_url)}">`:''}
  </div>`;

  if(d.video_list && d.video_list.length){
    h+=`<div class="card"><b>无水印下载</b>`+d.video_list.map((v,i)=>`
      <div class="q"><span class="lv">${esc(v.level.split('[')[0])}</span><span class="sz">${fmtMB(v.size)}</span>
      <a class="btn ${i===0?'pri':''}" href="${esc(v.url)}" target="_blank" download>下载</a>
      <button class="btn" onclick="copyTxt('${esc(v.url)}',this)">复制链接</button></div>`).join('')+`</div>`;
  }
  if(d.images && d.images.length){
    h+=`<div class="card"><b>无水印图片（${d.images.length} 张）</b><div class="imgs">`+
      d.images.map(im=>`<a href="${esc(im.url)}" target="_blank"><img loading="lazy" src="${esc(im.url)}"></a>`).join('')+
      `</div></div>`;
  }
  $('out').innerHTML=h;
}
</script>
</body>
</html>
